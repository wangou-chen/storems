server:
  port: 9999

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          # 仅开放显式路由，避免暴露内部认证接口。
          enabled: false
          # 小写 serviceId
          lower-case-service-id: true

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**

        - id: product-client
          uri: lb://product-client
          filters:
            - StripPrefix=1
          predicates:
            - Path=/product/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8888/eureka
